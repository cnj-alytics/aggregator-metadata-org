name: Noon UAE – Ranking lab test (GitHub IP)
run-name: ranking-lab t${{ inputs.test_id }} m${{ inputs.machine_no }}

# LAB TEST of production ranking-scrape.js methodology on GitHub runner IPs.
# Identical scraping logic, reports to noon_lab schema for diagnostics.
# Started by Supabase: noon_lab.dispatch_ranking_lab()

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'machine_no'
        required: true
        type: string
      max_areas:
        description: 'Max areas per machine (default 1)'
        required: false
        type: string
        default: '1'

concurrency:
  group: noon-ranking-lab-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ranking-lab t${{ inputs.test_id }} m${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            noon-mint-lab
            noon/uae

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ranking lab
        working-directory: noon-mint-lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WALL_LIMIT_SEC: '3600'
          MAX_AREAS: ${{ inputs.max_areas || '1' }}
        run: node ranking-lab.js
