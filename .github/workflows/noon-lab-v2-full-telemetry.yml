name: Noon UAE – Lab TLS + full telemetry probe (v2.7)
run-name: v2.7 test ${{ inputs.test_id }} m${{ inputs.machine_no }}

# Same TLS stack + lean mint as v2.6. Richer etracker telemetry:
#  - Mint-phase events (launch, launch_info, app_foreground, location_fetch,
#    page_home, whoami_ab_config, selected_zone) fired during mint
#  - 3-event triplets per outlet (outlet_impression + outlet_impression_v2 +
#    promotion_impression) during /search pagination

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'noon_lab.machine.machine_no'
        required: true
        type: string

concurrency:
  group: noon-lab-v2-v27-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: v2.7 probe test ${{ inputs.test_id }} machine ${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon-uae-lab-v2
      - name: Install curl-impersonate
        run: |
          set -e
          cd /tmp
          curl -sSL -o ci.tar.gz "https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz"
          mkdir -p /opt/ci
          tar -xzf ci.tar.gz -C /opt/ci
          echo "/opt/ci" >> $GITHUB_PATH
      - name: Install Node deps for reporter
        working-directory: noon-uae-lab-v2
        run: npm install --omit=dev --no-audit --no-fund
      - name: TLS + full telemetry probe
        working-directory: noon-uae-lab-v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          IMPERSONATE_WRAPPER: curl_safari15_3
        run: node tls-probe-v27.js
