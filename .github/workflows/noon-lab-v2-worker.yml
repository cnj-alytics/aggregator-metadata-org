name: Noon UAE – Lab Ranking v2 (Ubicloud EU, started by Supabase)
run-name: Noon lab v2 test ${{ inputs.test_id }} m${{ inputs.machine_no }} (Ubicloud)

# Same as noon-lab-v2-worker.yml but runs on Ubicloud (EU IP range, no proxy).
# Isolates IP origin as a variable: if v2.1 on Ubicloud performs noticeably
# differently from v2.1 on GitHub-hosted Azure IPs, Akamai's peak-hour hammer
# is targeting US datacenter IPs specifically rather than all datacenter IPs.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'noon_lab.machine.machine_no'
        required: true
        type: string

concurrency:
  group: noon-lab-v2-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    name: v2 test ${{ inputs.test_id }} machine ${{ inputs.machine_no }} (Ubicloud)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon-uae-lab-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: noon-uae-lab-v2
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run worker
        working-directory: noon-uae-lab-v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node worker.js
