name: Cross-platform UAE – v2 Secrets Check

# Read-only check that the org repo secrets work from a GitHub machine:
#   SUPABASE_DB_URL                  -> direct Postgres connection (session pooler)
#   SUPABASE_S3_ACCESS_KEY_ID/SECRET -> read one row from the existing Iceberg archive
# Prints only pass/fail and counts, never secret values.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --quiet "pyiceberg[pyarrow]==0.12.0" "psycopg[binary]==3.3.6"
      - name: Check secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlparse
          ok = True
          def report(line):
              print(line, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(line + "\n")
          report("## v2 secrets check")
          for name in ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_DB_URL", "SUPABASE_S3_ACCESS_KEY_ID", "SUPABASE_S3_SECRET_ACCESS_KEY"]:
              report(f"- {name}: {'set' if os.environ.get(name) else 'MISSING'}")
              ok = ok and bool(os.environ.get(name))
          try:
              import psycopg
              with psycopg.connect(os.environ["SUPABASE_DB_URL"], connect_timeout=15) as c:
                  n = c.execute("select count(*) from v2.branch").fetchone()[0]
              report(f"- Database connection: PASS (v2.branch has {n:,} rows)")
          except Exception as e:
              ok = False
              report(f"- Database connection: FAIL ({type(e).__name__})")
          try:
              from pyiceberg.catalog import load_catalog
              ref = urlparse(os.environ["SUPABASE_URL"]).hostname.split(".")[0]
              cat = load_catalog("supabase-analytics", type="rest", warehouse="deliveroo-ranking-archive",
                  uri=f"https://{ref}.supabase.co/storage/v1/iceberg", token=os.environ["SUPABASE_SERVICE_ROLE_KEY"],
                  **{"py-io-impl": "pyiceberg.io.pyarrow.PyArrowFileIO",
                     "s3.endpoint": f"https://{ref}.supabase.co/storage/v1/s3",
                     "s3.access-key-id": os.environ["SUPABASE_S3_ACCESS_KEY_ID"],
                     "s3.secret-access-key": os.environ["SUPABASE_S3_SECRET_ACCESS_KEY"],
                     "s3.region": "ap-southeast-2", "s3.force-virtual-addressing": False})
              ns = [".".join(x) for x in cat.list_namespaces()]
              report(f"- Iceberg catalog: PASS (namespaces: {', '.join(ns)})")
              t = cat.load_table(("deliveroo", "ranking_analysis"))
              rows = t.scan(limit=1).to_arrow().num_rows
              report(f"- S3 keys (read one archived row): PASS ({rows} row read)")
          except Exception as e:
              ok = False
              report(f"- Iceberg / S3 keys: FAIL ({type(e).__name__}: {str(e)[:150]})")
          report("**All checks passed**" if ok else "**Some checks failed**")
          sys.exit(0 if ok else 1)
          PY
