name: Noon UAE – Lab TLS v2.13 (outlet capture, 2 areas per machine)
run-name: v2.13 test ${{ inputs.test_id }} m${{ inputs.machine_no }}

# v2.13 — collects per-outlet listing data and inserts into noon_lab.outlet_capture.
# Cap at MAX_AREAS=2 per machine based on test 73 finding that area 3+ hits
# HTTP 429 rate limits ~75% of the time.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'noon_lab.machine.machine_no'
        required: true
        type: string

concurrency:
  group: noon-lab-v213-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: v2.13 probe test ${{ inputs.test_id }} machine ${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon-uae-lab-v2
      - name: Install curl-impersonate
        run: |
          set -e
          cd /tmp
          curl -sSL -o ci.tar.gz "https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz"
          mkdir -p /opt/ci
          tar -xzf ci.tar.gz -C /opt/ci
          echo "/opt/ci" >> $GITHUB_PATH
      - name: Install Node deps for reporter
        working-directory: noon-uae-lab-v2
        run: npm install --omit=dev --no-audit --no-fund
      - name: v2.13 probe (capture)
        working-directory: noon-uae-lab-v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          IMPERSONATE_WRAPPER: curl_safari15_3
          PAGE_GAP_MS_MIN: '5500'
          PAGE_GAP_MS_MAX: '7800'
          TOKEN_REFRESH_AT_MS: '240000'
          IMPRESSIONS_PER_PAGE: '6'
          MAX_AREAS: '2'
        run: node tls-probe-v213-capture.js
