name: Noon UAE – Lab Ranking Test (Ubicloud EU)
run-name: Noon lab test ${{ inputs.test_id }} m${{ inputs.machine_no }} (EU)

# Same as noon-uae-lab-ranking.yml but runs on Ubicloud (European IP, no proxy).
# Tests whether European datacenter IPs bypass Noon's peak-hour blocking.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'noon_lab.machine.machine_no'
        required: true
        type: string

concurrency:
  group: noon-lab-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    name: test ${{ inputs.test_id }} machine ${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon/uae
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Network diagnostics
        run: |
          echo "=== Runner IP ==="
          curl -s https://api.ipify.org
          echo ""
          echo "=== HTTP/2 (default) — whoami ==="
          curl -s -o /dev/null -w "http2: status=%{http_code} time=%{time_total}s\n" --max-time 10 -H "User-Agent: noon/22098" https://api-app-st.noon.com/_vs/st/st-whoami-api/whoami 2>&1 || echo "http2: failed"
          echo "=== HTTP/1.1 — whoami ==="
          curl -s -o /dev/null -w "http1.1: status=%{http_code} time=%{time_total}s\n" --http1.1 --max-time 10 -H "User-Agent: noon/22098" https://api-app-st.noon.com/_vs/st/st-whoami-api/whoami 2>&1 || echo "http1.1: failed"
          echo "=== HTTP/1.1 verbose — whoami ==="
          curl -v --http1.1 --max-time 10 -H "User-Agent: noon/22098" https://api-app-st.noon.com/_vs/st/st-whoami-api/whoami 2>&1 || true
          echo ""
          echo "=== HTTP/1.1 — food search ==="
          curl -s -o /dev/null -w "http1.1 food: status=%{http_code} time=%{time_total}s\n" --http1.1 --max-time 10 https://api-app-fd.noon.com/_svc/mp-food-api-catalog/api/search 2>&1 || echo "http1.1 food: failed"
      - name: Run lab worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HTTP1_ONLY: '1'
        run: |
          npm install undici
          node noon/uae/lab-ranking.js
