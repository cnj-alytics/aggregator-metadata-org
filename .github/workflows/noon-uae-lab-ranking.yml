name: Noon UAE – Lab Ranking Test (started by Supabase)
run-name: Noon lab test ${{ inputs.test_id }} m${{ inputs.machine_no }}

# TEST-ONLY. One machine = one area attempt for a noon_lab test (page-gap experiments).
# Started by Supabase: select noon_lab_start('name');  Stop: select noon_lab_stop(<test_id>);
# Saves only measurements to the noon_lab schema — no ranking data.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'noon_lab.machine.machine_no'
        required: true
        type: string
      http1_only:
        description: 'Force HTTP/1.1 (set to 1)'
        required: false
        type: string
        default: '0'
      http10_mode:
        description: 'Force HTTP/1.0 style — fresh TCP per request (set to 1)'
        required: false
        type: string
        default: '0'
      adaptive_http:
        description: 'Smart cascade: try h2 → h1.1 → h1.0 per area (set to 1)'
        required: false
        type: string
        default: '0'
      http3_only:
        description: 'HTTP/3 only via curl QUIC/UDP (set to 1)'
        required: false
        type: string
        default: '0'
      max_areas:
        description: 'Max areas per machine (default 10)'
        required: false
        type: string
        default: '10'

concurrency:
  group: noon-lab-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: test ${{ inputs.test_id }} machine ${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon/uae
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install curl with HTTP/3
        if: inputs.http3_only == '1'
        run: |
          # Ubuntu's default curl lacks HTTP/3 (QUIC). Install stunnel's static build with ngtcp2+nghttp3.
          curl -sL https://github.com/stunnel/static-curl/releases/download/8.23.0/curl-linux-x86_64-glibc-8.23.0.tar.xz -o /tmp/curl-h3.tar.xz
          tar xJf /tmp/curl-h3.tar.xz -C /tmp
          sudo mv /tmp/curl /usr/local/bin/curl
          curl --version | head -1
          curl --version | grep -i 'http3\|HTTP3' && echo "HTTP/3: YES" || echo "HTTP/3: NOT FOUND"
      - name: Run lab worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROXY_URL: ${{ secrets.NOON_PROXY_URL }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HTTP1_ONLY: ${{ inputs.http1_only }}
          HTTP10_MODE: ${{ inputs.http10_mode }}
          ADAPTIVE_HTTP: ${{ inputs.adaptive_http }}
          HTTP3_ONLY: ${{ inputs.http3_only }}
          MAX_AREAS: ${{ inputs.max_areas }}
        run: |
          npm install undici
          node noon/uae/lab-ranking.js
