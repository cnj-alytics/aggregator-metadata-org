name: Noon UAE – Fallback lab test (independent machines)
run-name: fallback-lab t${{ inputs.test_id }} m${{ inputs.machine_no }} ${{ inputs.fleet }} ${{ inputs.proxy_port }}

# TEST-ONLY. Each machine is an independent device — no shared rate limiting.
# Started by Supabase: select noon_lab_start('name');

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'machine_no'
        required: true
        type: string
      fleet:
        description: 'uae | decodo'
        required: true
        type: string
      proxy_port:
        description: 'Decodo port (decodo fleet only)'
        required: false
        type: string
      max_areas:
        description: 'Max areas per machine (default 5)'
        required: false
        type: string
        default: '5'

concurrency:
  group: noon-fallback-lab-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: fallback-lab t${{ inputs.test_id }} m${{ inputs.machine_no }} (${{ inputs.fleet }} ${{ inputs.proxy_port }})
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon-mint-lab

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q curl_cffi==0.17.0

      - name: Run fallback lab
        working-directory: noon-mint-lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          FLEET: ${{ inputs.fleet }}
          PROXY_PORT: ${{ inputs.proxy_port }}
          NOON_PROXY_URL: ${{ inputs.fleet == 'decodo' && secrets.NOON_PROXY_URL_DECODO || secrets.NOON_PROXY_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WALL_LIMIT_SEC: '3600'
          MAX_AREAS: ${{ inputs.max_areas || '5' }}
        run: python -u fallback-lab.py
