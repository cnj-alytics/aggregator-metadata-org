name: Noon UAE – Lab TLS v2.9 (periodic remint + retry)
run-name: v2.9 test ${{ inputs.test_id }} m${{ inputs.machine_no }}

# v2.9 adds whoami retry to v2.8:
#  - Every whoami call (initial mint and mid-session remints) gets ONE retry
#    on 403/429/503/null with a 2-3s jittered backoff.
#  - /search is NOT retried — once Akamai kicks you off /search, immediate
#    retry keeps you dead.
#  - Retry attempts are logged as `step_retry1` so we can measure retry
#    success rate directly.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'noon_lab.machine.machine_no'
        required: true
        type: string

concurrency:
  group: noon-lab-v29-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: v2.9 probe test ${{ inputs.test_id }} machine ${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon-uae-lab-v2
      - name: Install curl-impersonate
        run: |
          set -e
          cd /tmp
          curl -sSL -o ci.tar.gz "https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz"
          mkdir -p /opt/ci
          tar -xzf ci.tar.gz -C /opt/ci
          echo "/opt/ci" >> $GITHUB_PATH
      - name: Install Node deps for reporter
        working-directory: noon-uae-lab-v2
        run: npm install --omit=dev --no-audit --no-fund
      - name: v2.9 probe (periodic remint + whoami retry)
        working-directory: noon-uae-lab-v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          IMPERSONATE_WRAPPER: curl_safari15_3
          REMINT_EVERY_PAGES: '3'
        run: node tls-probe-v29.js
