name: Noon UAE – Lab mint-only probe (isolation test)
run-name: mint-probe test ${{ inputs.test_id }} m${{ inputs.machine_no }}

# Isolation experiment: runs ONLY the mint phase (whoami → set-location →
# whoami-food, plus mint-phase etracker events). No /search, no pagination.
# Purpose: measure mint success rate across many fresh IPs in parallel,
# distinguish mint-level blocks from search-level blocks.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'noon_lab.machine.machine_no'
        required: true
        type: string

concurrency:
  group: noon-lab-mint-probe-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: mint-probe test ${{ inputs.test_id }} machine ${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon-uae-lab-v2
      - name: Install curl-impersonate
        run: |
          set -e
          cd /tmp
          curl -sSL -o ci.tar.gz "https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz"
          mkdir -p /opt/ci
          tar -xzf ci.tar.gz -C /opt/ci
          echo "/opt/ci" >> $GITHUB_PATH
      - name: Install Node deps for reporter
        working-directory: noon-uae-lab-v2
        run: npm install --omit=dev --no-audit --no-fund
      - name: Mint-only probe
        working-directory: noon-uae-lab-v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          IMPERSONATE_WRAPPER: curl_safari15_3
        run: node mint-probe.js
