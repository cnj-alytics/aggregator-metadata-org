name: Noon UAE – Multi-worker lab test (6 IPs per machine)
run-name: multi-lab t${{ inputs.test_id }} m${{ inputs.machine_no }} (6 workers)

# TEST: One GitHub machine runs 6 parallel fallback-lab workers,
# each with its own Decodo datacenter proxy IP.
# Machine 1 → ports 10001-10006, Machine 2 → ports 10007-10012, etc.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: 'noon_lab.test.test_id'
        required: true
        type: string
      machine_no:
        description: 'machine_no (1-based, determines port range)'
        required: true
        type: string
      worker_count:
        description: 'workers per machine (default 6)'
        required: false
        type: string
        default: '6'

concurrency:
  group: noon-multi-lab-${{ inputs.test_id }}-m${{ inputs.machine_no }}
  cancel-in-progress: false

jobs:
  multi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: multi-lab t${{ inputs.test_id }} m${{ inputs.machine_no }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: noon-mint-lab

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q curl_cffi==0.17.0

      - name: Run multi-worker
        working-directory: noon-mint-lab
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_ID: ${{ inputs.test_id }}
          MACHINE_NO: ${{ inputs.machine_no }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          NOON_PROXY_URL_DC: ${{ secrets.NOON_PROXY_URL_DC }}
          WORKER_COUNT: ${{ inputs.worker_count || '6' }}
          WALL_LIMIT_SEC: '3600'
        run: python -u multi-worker.py
